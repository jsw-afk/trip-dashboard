<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4박5일 여행 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", -apple-system, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 16px 12px 48px;
    color: #222;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.2rem; text-align: center; margin: 4px 0 16px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1; padding: 10px; border: none; border-radius: 8px;
    background: #e0e0e0; color: #444; font-size: 0.95rem; cursor: pointer;
  }
  .tab-btn.active { background: #4caf50; color: white; font-weight: bold; }

  .panel { display: none; }
  .panel.active { display: block; }

  .day-tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
  .day-btn {
    flex-shrink: 0; padding: 6px 14px; border: 1px solid #ccc; border-radius: 999px;
    background: white; color: #555; font-size: 0.85rem; cursor: pointer;
  }
  .day-btn.active { background: #1565c0; color: white; border-color: #1565c0; }

  .card {
    background: white; border-radius: 10px; padding: 14px;
    margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .item-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .item-time { font-weight: bold; color: #1565c0; font-size: 0.9rem; min-width: 48px; }
  .item-main { flex: 1; }
  .item-place { font-weight: bold; }
  .item-memo { font-size: 0.85rem; color: #666; margin-top: 2px; white-space: pre-wrap; }
  .item-actions button {
    background: none; border: none; color: #999; font-size: 0.85rem; cursor: pointer; padding: 2px 4px;
  }

  form.add-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  form.add-form input, form.add-form select, form.add-form textarea {
    padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; font-family: inherit;
  }
  form.add-form .row { display: flex; gap: 6px; }
  form.add-form .row input { flex: 1; }
  form.add-form button {
    padding: 10px; border: none; border-radius: 6px; background: #4caf50; color: white;
    font-size: 0.9rem; cursor: pointer;
  }

  .empty-msg { color: #999; text-align: center; padding: 12px 0; font-size: 0.9rem; }

  .budget-summary { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.95rem; }
  .budget-summary .label { color: #666; }
  .budget-total { font-size: 1.3rem; font-weight: bold; color: #d32f2f; }
  .rate-line { font-size: 0.8rem; color: #888; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
  .rate-line button { border: none; background: #eee; border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; }

  .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .expense-item:last-child { border-bottom: none; }
  .expense-cat { font-size: 0.75rem; background: #eee; border-radius: 4px; padding: 1px 6px; margin-left: 6px; color: #555; }
  .expense-amount { text-align: right; }
  .expense-amount .jpy { font-weight: bold; }
  .expense-amount .krw { font-size: 0.75rem; color: #888; }

  #map { width: 100%; height: 320px; border-radius: 8px; background: #eee; }
  .saved-place-item {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 8px 0; border-bottom: 1px solid #f0f0f0; gap: 8px;
  }
  .saved-place-item:last-child { border-bottom: none; }
  .saved-place-name { font-weight: bold; font-size: 0.9rem; }
  .saved-place-address { font-size: 0.78rem; color: #888; }

  .search-result-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #f0f0f0; gap: 8px;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-name { font-size: 0.85rem; }
  .search-result-item button {
    flex-shrink: 0; border: none; background: #4caf50; color: white;
    border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <h1>✈️ 4박5일 여행 대시보드</h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="itinerary">📅 일정</button>
    <button class="tab-btn" data-tab="budget">💰 예산</button>
    <button class="tab-btn" data-tab="map">🗺️ 지도</button>
  </div>

  <!-- 일정 -->
  <section id="panel-itinerary" class="panel active">
    <div class="day-tabs" id="day-tabs"></div>
    <div id="itinerary-list"></div>

    <div class="card">
      <form class="add-form" id="itinerary-form">
        <div class="row">
          <input type="time" id="item-time" required>
          <input type="text" id="item-place" placeholder="장소 (필수, 저장된 장소 자동완성됨)" list="saved-places-datalist" required>
        </div>
        <datalist id="saved-places-datalist"></datalist>
        <textarea id="item-memo" placeholder="메모 (이동시간, 영업시간, 준비물 등)" rows="2"></textarea>
        <button type="submit">일정 추가</button>
      </form>
    </div>
  </section>

  <!-- 예산 -->
  <section id="panel-budget" class="panel">
    <div class="card">
      <div class="budget-summary">
        <span class="label">예산</span>
        <span><input type="number" id="budget-limit" placeholder="0" style="width:100px;text-align:right;border:1px solid #ccc;border-radius:4px;padding:2px 6px;"> 원</span>
      </div>
      <div class="budget-summary">
        <span class="label">총 지출</span>
        <span class="budget-total" id="total-krw">0원</span>
      </div>
      <div class="budget-summary">
        <span class="label">남은 예산</span>
        <span id="remaining-krw">-</span>
      </div>
      <div class="rate-line">
        <span id="rate-info">환율 불러오는 중...</span>
        <button id="refresh-rate-btn" type="button">환율 새로고침</button>
      </div>
    </div>

    <div class="card">
      <div id="expense-list"></div>
      <p class="empty-msg" id="expense-empty" hidden>지출 내역이 없습니다.</p>
    </div>

    <div class="card">
      <form class="add-form" id="expense-form">
        <input type="text" id="expense-name" placeholder="항목 (예: 스시 오마카세)" required>
        <div class="row">
          <input type="number" id="expense-amount" placeholder="금액(엔)" required min="0">
          <select id="expense-category">
            <option value="식비">🍜 식비</option>
            <option value="교통">🚃 교통</option>
            <option value="쇼핑">🛍️ 쇼핑</option>
            <option value="숙소">🏨 숙소</option>
            <option value="기타">📌 기타</option>
          </select>
        </div>
        <button type="submit">지출 추가</button>
      </form>
    </div>
  </section>

  <!-- 지도 -->
  <section id="panel-map" class="panel">
    <div class="card">
      <div id="map"></div>
    </div>

    <div class="card">
      <label style="font-size:0.9rem;font-weight:bold;">도보 경로 찾기</label>
      <p style="font-size:0.8rem;color:#666;margin:4px 0 8px;">
        저장된 장소가 2개 이상이어야 선택할 수 있습니다. 대중교통(지하철/버스) 경로는 무료로는
        지원이 안 돼서 도보/직선 거리 기준으로만 보여줍니다.
      </p>
      <form class="add-form" id="route-form">
        <div class="row">
          <select id="route-from" required></select>
          <select id="route-to" required></select>
        </div>
        <button type="submit">경로 찾기</button>
      </form>
      <p id="route-result" style="font-size:0.85rem;color:#555;margin-top:8px;"></p>
    </div>

    <div class="card">
      <label style="font-size:0.9rem;font-weight:bold;">장소 검색해서 추가</label>
      <p style="font-size:0.8rem;color:#666;margin:4px 0 8px;">
        구글 계정/API 키 없이 되는 무료 검색(OpenStreetMap)입니다. 검색 버튼을 누를 때만 조회돼요.
        한글로 검색하면 자동으로 영어로 번역해서 찾아줍니다(해외 장소는 한글 이름이 없는 경우가 많아서).
      </p>
      <form class="add-form" id="place-search-form">
        <div class="row">
          <input type="text" id="place-search-input" placeholder="장소 이름 (한글 가능, 예: 츠키지 시장)" required>
          <button type="submit" style="flex:0 0 auto;">검색</button>
        </div>
      </form>
      <div id="place-search-results"></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-weight:bold;font-size:0.9rem;">저장된 장소 (<span id="saved-places-count">0</span>)</span>
        <button type="button" id="clear-places-btn" style="border:none;background:#eee;border-radius:6px;padding:4px 10px;font-size:0.75rem;cursor:pointer;">전체 삭제</button>
      </div>
      <div id="saved-places-list"></div>
      <p class="empty-msg" id="saved-places-empty">가져온 장소가 없습니다.</p>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const DAY_COLORS = ["#e53935", "#1e88e5", "#43a047", "#fb8c00", "#8e24aa"];

const DAY_COUNT = 5;
const STORAGE_KEYS = {
  itinerary: "trip_itinerary_v1",
  expenses: "trip_expenses_v1",
  budgetLimit: "trip_budget_limit_v1",
  rate: "trip_jpy_krw_rate_v1",
  places: "trip_saved_places_v1",
};

let currentDay = 1;
let itinerary = JSON.parse(localStorage.getItem(STORAGE_KEYS.itinerary) || "{}");
let expenses = JSON.parse(localStorage.getItem(STORAGE_KEYS.expenses) || "[]");
let jpyToKrwRate = JSON.parse(localStorage.getItem(STORAGE_KEYS.rate) || "null");
let savedPlaces = JSON.parse(localStorage.getItem(STORAGE_KEYS.places) || "[]");

// ── 탭 전환 ──────────────────────────────────────────
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");

    // 지도가 숨겨진(display:none) 상태에서 초기화되면 Leaflet이 크기를 0으로 잘못 계산해
    // 타일이 깨져 보인다 — 탭이 실제로 보이게 된 직후 크기를 다시 계산해준다(Leaflet 공식 권장 방식).
    if (btn.dataset.tab === "map" && map) {
      setTimeout(() => map.invalidateSize(), 0);
    }
  });
});

// ── 일정 ────────────────────────────────────────────
function renderDayTabs() {
  const wrap = document.getElementById("day-tabs");
  wrap.innerHTML = "";
  for (let d = 1; d <= DAY_COUNT; d++) {
    const btn = document.createElement("button");
    btn.className = "day-btn" + (d === currentDay ? " active" : "");
    btn.textContent = `Day ${d}`;
    btn.addEventListener("click", () => { currentDay = d; renderDayTabs(); renderItinerary(); });
    wrap.appendChild(btn);
  }
}

function renderItinerary() {
  const list = document.getElementById("itinerary-list");
  const items = (itinerary[currentDay] || []).slice().sort((a, b) => a.time.localeCompare(b.time));
  if (items.length === 0) {
    list.innerHTML = `<p class="empty-msg">Day ${currentDay} 일정이 없습니다. 아래에서 추가해보세요.</p>`;
    return;
  }
  list.innerHTML = items.map((item) => `
    <div class="card item-row" data-id="${item.id}">
      <div class="item-time">${item.time}</div>
      <div class="item-main">
        <div class="item-place">${escapeHtml(item.place)}${item.lat ? " 📍" : ""}</div>
        ${item.memo ? `<div class="item-memo">${escapeHtml(item.memo)}</div>` : ""}
      </div>
      <div class="item-actions"><button type="button" class="delete-item-btn">삭제</button></div>
    </div>`).join("");
}

document.getElementById("itinerary-form").addEventListener("submit", (evt) => {
  evt.preventDefault();
  const time = document.getElementById("item-time").value;
  const place = document.getElementById("item-place").value.trim();
  const memo = document.getElementById("item-memo").value.trim();
  if (!time || !place) return;

  // 저장된 장소 목록과 이름이 정확히 일치하면 좌표를 같이 붙여서 지도에도 표시되게 한다.
  const matched = savedPlaces.find((p) => p.name === place);

  if (!itinerary[currentDay]) itinerary[currentDay] = [];
  itinerary[currentDay].push({
    id: Date.now(), time, place, memo,
    lat: matched ? matched.lat : null,
    lng: matched ? matched.lng : null,
  });
  localStorage.setItem(STORAGE_KEYS.itinerary, JSON.stringify(itinerary));

  evt.target.reset();
  renderItinerary();
  refreshMarkers();
});

document.getElementById("itinerary-list").addEventListener("click", (evt) => {
  if (!evt.target.classList.contains("delete-item-btn")) return;
  const id = Number(evt.target.closest(".card").dataset.id);
  itinerary[currentDay] = (itinerary[currentDay] || []).filter((i) => i.id !== id);
  localStorage.setItem(STORAGE_KEYS.itinerary, JSON.stringify(itinerary));
  renderItinerary();
  refreshMarkers();
});

// ── 예산 ────────────────────────────────────────────
const budgetLimitInput = document.getElementById("budget-limit");
budgetLimitInput.value = localStorage.getItem(STORAGE_KEYS.budgetLimit) || "";
budgetLimitInput.addEventListener("input", () => {
  localStorage.setItem(STORAGE_KEYS.budgetLimit, budgetLimitInput.value);
  renderBudgetSummary();
});

function renderExpenses() {
  const list = document.getElementById("expense-list");
  const emptyMsg = document.getElementById("expense-empty");
  emptyMsg.hidden = expenses.length > 0;

  list.innerHTML = expenses.slice().reverse().map((e) => {
    const krw = jpyToKrwRate ? Math.round(e.amountJpy * jpyToKrwRate.rate) : null;
    return `
    <div class="expense-item" data-id="${e.id}">
      <div>
        ${escapeHtml(e.name)}
        <span class="expense-cat">${e.category}</span>
      </div>
      <div class="expense-amount">
        <div class="jpy">¥${e.amountJpy.toLocaleString()}</div>
        ${krw !== null ? `<div class="krw">≈ ${krw.toLocaleString()}원</div>` : ""}
      </div>
      <div class="item-actions"><button type="button" class="delete-expense-btn">삭제</button></div>
    </div>`;
  }).join("");

  renderBudgetSummary();
}

function renderBudgetSummary() {
  const totalJpy = expenses.reduce((sum, e) => sum + e.amountJpy, 0);
  const totalKrw = jpyToKrwRate ? Math.round(totalJpy * jpyToKrwRate.rate) : null;
  document.getElementById("total-krw").textContent =
    totalKrw !== null ? `¥${totalJpy.toLocaleString()} (≈ ${totalKrw.toLocaleString()}원)` : `¥${totalJpy.toLocaleString()}`;

  const limit = Number(budgetLimitInput.value) || 0;
  const remainingEl = document.getElementById("remaining-krw");
  if (limit > 0 && totalKrw !== null) {
    const remaining = limit - totalKrw;
    remainingEl.textContent = `${remaining.toLocaleString()}원`;
    remainingEl.style.color = remaining < 0 ? "#d32f2f" : "#1565c0";
  } else {
    remainingEl.textContent = "-";
  }
}

document.getElementById("expense-form").addEventListener("submit", (evt) => {
  evt.preventDefault();
  const name = document.getElementById("expense-name").value.trim();
  const amountJpy = Number(document.getElementById("expense-amount").value);
  const category = document.getElementById("expense-category").value;
  if (!name || !amountJpy) return;

  expenses.push({ id: Date.now(), name, amountJpy, category });
  localStorage.setItem(STORAGE_KEYS.expenses, JSON.stringify(expenses));

  evt.target.reset();
  renderExpenses();
});

document.getElementById("expense-list").addEventListener("click", (evt) => {
  if (!evt.target.classList.contains("delete-expense-btn")) return;
  const id = Number(evt.target.closest(".expense-item").dataset.id);
  expenses = expenses.filter((e) => e.id !== id);
  localStorage.setItem(STORAGE_KEYS.expenses, JSON.stringify(expenses));
  renderExpenses();
});

// ── 환율 ────────────────────────────────────────────
async function fetchRate() {
  const rateInfo = document.getElementById("rate-info");
  rateInfo.textContent = "환율 불러오는 중...";
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/JPY");
    const data = await res.json();
    if (data.result !== "success") throw new Error("API 실패");
    jpyToKrwRate = { rate: data.rates.KRW, updatedAt: data.time_last_update_utc };
    localStorage.setItem(STORAGE_KEYS.rate, JSON.stringify(jpyToKrwRate));
  } catch (err) {
    // 오프라인이면 조용히 캐시된 값을 계속 사용
  }
  renderRateInfo();
  renderExpenses();
}

function renderRateInfo() {
  const rateInfo = document.getElementById("rate-info");
  if (jpyToKrwRate) {
    rateInfo.textContent = `100엔 ≈ ${Math.round(jpyToKrwRate.rate * 100).toLocaleString()}원 (기준: ${jpyToKrwRate.updatedAt})`;
  } else {
    rateInfo.textContent = "환율 정보 없음 (오프라인)";
  }
}

document.getElementById("refresh-rate-btn").addEventListener("click", fetchRate);

// ── 장소 검색(Nominatim/OpenStreetMap) ───────────────────
// 무료·무가입 검색 API. 정책상 "타이핑할 때마다 자동완성 조회"는 금지돼 있어서
// (nominatim.org 사용정책 — Auto-complete search 항목 참고) 검색 버튼을 눌렀을 때만 호출한다.
//
// 해외(특히 일본) 장소는 OSM에 한글 이름이 거의 없어서 한글로 검색하면 결과가 안 나온다.
// 입력에 한글이 섞여 있으면 무료 번역 API(MyMemory, 키 불필요)로 영어로 바꾼 뒤 검색한다.
function containsKorean(text) {
  return /[가-힣]/.test(text);
}

async function translateToEnglish(text) {
  const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`);
  const data = await res.json();
  return (data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : text;
}

document.getElementById("place-search-form").addEventListener("submit", async (evt) => {
  evt.preventDefault();
  const query = document.getElementById("place-search-input").value.trim();
  if (!query) return;

  const resultsEl = document.getElementById("place-search-results");
  const submitBtn = evt.target.querySelector("button[type=submit]");
  submitBtn.disabled = true;
  resultsEl.innerHTML = `<p class="empty-msg">검색 중...</p>`;

  try {
    let searchTerm = query;
    if (containsKorean(query)) {
      resultsEl.innerHTML = `<p class="empty-msg">번역 중...</p>`;
      searchTerm = await translateToEnglish(query);
      resultsEl.innerHTML = `<p class="empty-msg">번역: "${escapeHtml(query)}" → "${escapeHtml(searchTerm)}" · 검색 중...</p>`;
    }

    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ko&addressdetails=1&q=${encodeURIComponent(searchTerm)}`;
    const res = await fetch(url);
    const results = await res.json();

    if (results.length === 0) {
      resultsEl.innerHTML = `<p class="empty-msg">검색 결과가 없습니다${searchTerm !== query ? ` ("${escapeHtml(searchTerm)}"로 검색함)` : ""}.</p>`;
      return;
    }

    resultsEl.innerHTML = results.map((r, i) => `
      <div class="search-result-item" data-index="${i}">
        <span class="search-result-name">${escapeHtml(r.display_name)}</span>
        <button type="button" class="add-search-result-btn">추가</button>
      </div>`).join("");

    resultsEl.querySelectorAll(".add-search-result-btn").forEach((btn, i) => {
      btn.addEventListener("click", () => {
        const r = results[i];
        const name = query; // 목록에서 자동완성될 이름은 사용자가 검색한 짧은 이름으로
        if (!savedPlaces.some((p) => p.name === name)) {
          savedPlaces.push({
            id: `${r.lat},${r.lon}`, name, address: r.display_name,
            lat: parseFloat(r.lat), lng: parseFloat(r.lon),
          });
          localStorage.setItem(STORAGE_KEYS.places, JSON.stringify(savedPlaces));
          renderSavedPlaces();
          renderPlacesDatalist();
  renderRouteSelects();
          refreshMarkers();
        }
        resultsEl.innerHTML = `<p class="empty-msg">"${escapeHtml(name)}" 추가 완료! 저장된 장소 목록에서 확인하세요.</p>`;
      });
    });
  } catch (err) {
    resultsEl.innerHTML = `<p class="empty-msg">검색 중 오류가 발생했습니다.</p>`;
  } finally {
    submitBtn.disabled = false;
  }
});

// ── 저장된 장소 ──────────────────────────────────────────
function renderSavedPlaces() {
  document.getElementById("saved-places-count").textContent = savedPlaces.length;
  const list = document.getElementById("saved-places-list");
  document.getElementById("saved-places-empty").hidden = savedPlaces.length > 0;
  list.innerHTML = savedPlaces.map((p) => `
    <div class="saved-place-item" data-id="${p.id}">
      <div>
        <div class="saved-place-name">${escapeHtml(p.name)}</div>
        ${p.address ? `<div class="saved-place-address">${escapeHtml(p.address)}</div>` : ""}
      </div>
      <div class="item-actions"><button type="button" class="delete-place-btn">삭제</button></div>
    </div>`).join("");
}

function renderPlacesDatalist() {
  document.getElementById("saved-places-datalist").innerHTML =
    savedPlaces.map((p) => `<option value="${escapeHtml(p.name)}">`).join("");
}

function renderRouteSelects() {
  const options = savedPlaces.map((p) => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("");
  document.getElementById("route-from").innerHTML = options || `<option value="">저장된 장소 없음</option>`;
  document.getElementById("route-to").innerHTML = options || `<option value="">저장된 장소 없음</option>`;
}

document.getElementById("saved-places-list").addEventListener("click", (evt) => {
  if (!evt.target.classList.contains("delete-place-btn")) return;
  const id = evt.target.closest(".saved-place-item").dataset.id;
  savedPlaces = savedPlaces.filter((p) => p.id !== id);
  localStorage.setItem(STORAGE_KEYS.places, JSON.stringify(savedPlaces));
  renderSavedPlaces();
  renderPlacesDatalist();
  renderRouteSelects();
  refreshMarkers();
});

document.getElementById("clear-places-btn").addEventListener("click", () => {
  if (savedPlaces.length === 0 || !confirm("저장된 장소를 전부 삭제할까요?")) return;
  savedPlaces = [];
  localStorage.setItem(STORAGE_KEYS.places, JSON.stringify(savedPlaces));
  renderSavedPlaces();
  renderPlacesDatalist();
  renderRouteSelects();
  refreshMarkers();
});

// ── 지도 (Leaflet + OpenStreetMap, API 키/가입/결제 불필요) ──
let map = null;
let mapMarkers = [];

function initMap() {
  map = L.map("map").setView([35.6812, 139.7671], 12); // 도쿄역 기준 초기 중심
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19,
  }).addTo(map);
  refreshMarkers();
}

function refreshMarkers() {
  if (!map) return;
  mapMarkers.forEach((m) => map.removeLayer(m));
  mapMarkers = [];

  // 저장된 장소: 회색 점
  savedPlaces.forEach((p) => {
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: 7, color: "white", weight: 2, fillColor: "#9e9e9e", fillOpacity: 1,
    }).addTo(map);
    marker.bindPopup(`<b>${escapeHtml(p.name)}</b><br>${escapeHtml(p.address || "")}`);
    mapMarkers.push(marker);
  });

  // 일정에 좌표가 연결된 항목: 날짜별 색상 원
  for (let d = 1; d <= DAY_COUNT; d++) {
    (itinerary[d] || []).forEach((item) => {
      if (!item.lat || !item.lng) return;
      const marker = L.circleMarker([item.lat, item.lng], {
        radius: 9, color: "white", weight: 2, fillColor: DAY_COLORS[d - 1], fillOpacity: 1,
      }).addTo(map);
      marker.bindPopup(`<b>Day${d} ${item.time}</b><br>${escapeHtml(item.place)}`);
      mapMarkers.push(marker);
    });
  }
}

// ── 도보 경로 찾기(OSRM 공개 데모 서버, 키/가입 불필요) ─────
// 공개 데모 서버는 "도보" 프로필을 실제로 지원하지 않고 자동차 기준으로 계산해서(테스트해서
// 확인함 — 동일 구간 도보/자동차 요청 결과가 완전히 같았음), duration 값은 안 믿고 경로 선과
// 거리(distance)만 쓴 뒤, 도보 시간은 표준 도보속도(시속 4.5km)로 직접 계산한다.
const WALK_SPEED_M_PER_MIN = 4500 / 60; // 시속 4.5km

let routeLine = null;

document.getElementById("route-form").addEventListener("submit", async (evt) => {
  evt.preventDefault();
  const fromId = document.getElementById("route-from").value;
  const toId = document.getElementById("route-to").value;
  const resultEl = document.getElementById("route-result");

  if (!fromId || !toId) return;
  if (fromId === toId) {
    resultEl.textContent = "출발지와 도착지가 같습니다.";
    return;
  }

  const from = savedPlaces.find((p) => p.id === fromId);
  const to = savedPlaces.find((p) => p.id === toId);
  if (!from || !to) return;

  resultEl.textContent = "경로 찾는 중...";
  try {
    const url = `https://router.project-osrm.org/route/v1/foot/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.code !== "Ok" || !data.routes || !data.routes[0]) {
      resultEl.textContent = "경로를 찾을 수 없습니다(도보로 이동 불가능한 구간일 수 있음).";
      return;
    }

    const route = data.routes[0];
    const distanceKm = (route.distance / 1000).toFixed(2);
    const walkMinutes = Math.round(route.distance / WALK_SPEED_M_PER_MIN);
    resultEl.textContent = `${from.name} → ${to.name}: 약 ${distanceKm}km, 도보 약 ${walkMinutes}분 (시속 4.5km 기준 추정치, 실제와 다를 수 있음)`;

    if (routeLine) map.removeLayer(routeLine);
    // OSRM geometry는 [lng, lat] 순서라 Leaflet이 쓰는 [lat, lng]로 뒤집어준다.
    const latlngs = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
    routeLine = L.polyline(latlngs, { color: "#1565c0", weight: 4, opacity: 0.8 }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [24, 24] });
  } catch (err) {
    resultEl.textContent = "경로 조회 중 오류가 발생했습니다.";
  }
});

// ── 유틸 ────────────────────────────────────────────
function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// ── 초기화 ──────────────────────────────────────────
renderDayTabs();
renderItinerary();
renderRateInfo();
renderExpenses();
renderSavedPlaces();
renderPlacesDatalist();
  renderRouteSelects();
initMap();
if (!jpyToKrwRate) fetchRate();
</script>
